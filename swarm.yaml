version: 1
workers:
  - id: coder
    name: Coder
    role: Scoped Implementation
    specialty: focused implementation, tests, small diffs, build/debug
    model: qwen3.8-27b-dense
    mission: Ship scoped code slices with tests, minimal diffs, and verification evidence.
    profile: coder
    modes:
      - task
    tools:
      - terminal
      - file
      - coding
      - session_search
      - todo
    skills: []
    capabilities:
      - implementation
      - code-editing
      - tests
      - build-verification
      - debugging
    preferredTaskTypes:
      - implementation
      - bugfix
      - feature
      - refactor
    greenlightRequiredFor:
      - merge
      - push
      - destructive
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    wrapper: coder:task
  - id: reasoner
    name: Reasoner
    role: Reasoning / Planning
    specialty: planning, math, multi-step logic, trade-off analysis, decision framing
    model: qwen3.8-27b-dense
    mission: Turn ambiguity into a clear decision plus rationale and trade-offs. No side effects.
    profile: reasoner
    modes:
      - plan
    tools:
      - todo
    skills: []
    capabilities:
      - reasoning
      - planning
      - decision-framing
      - analysis
    preferredTaskTypes:
      - planning
      - analysis
      - strategy
      - decision
    greenlightRequiredFor:
      - irreversible-decision
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    wrapper: reasoner:plan
  - id: researcher
    name: Researcher
    role: Research / Synthesis
    specialty: web lookup, source reading, synthesis, cited findings
    model: qwen3.8-27b-dense
    mission: Produce decision-grade research with cited, structured findings and explicit uncertainty.
    profile: researcher
    modes:
      - quick
    tools:
      - web
      - search
      - session_search
      - file
      - todo
    skills: []
    capabilities:
      - research
      - synthesis
      - source-verification
    preferredTaskTypes:
      - research
      - analysis
      - options
      - source-review
    greenlightRequiredFor:
      - publish
      - external-send
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    wrapper: researcher:quick
  - id: reviewer
    name: Reviewer
    role: Independent Review / Gate
    specialty: security review, logic review, regression detection, quality gate
    model: qwen3.8-27b-dense
    mission: Independently and adversarially review work; block unsafe, untested, or broken changes.
    profile: reviewer
    modes:
      - gate
    tools:
      - terminal
      - file
      - session_search
    skills: []
    capabilities:
      - code-review
      - security-review
      - regression-analysis
      - quality-gate
    preferredTaskTypes:
      - review
      - qa
      - verification
      - merge-gate
    greenlightRequiredFor:
      - approve-merge
      - destructive
    reviewRequired: false
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    wrapper: reviewer:gate
  - id: operator
    name: Operator
    role: Infra / Ops
    specialty: docker, cron, kanban, homelab, runtime health, lifecycle
    model: qwen3.8-27b-dense
    mission: Perform ops actions safely and verify the side-effect actually happened before reporting.
    profile: operator
    modes:
      - health
    tools:
      - terminal
      - cronjob
      - kanban
      - homeassistant
      - file
    skills: []
    capabilities:
      - ops-health
      - runtime-monitoring
      - cron
      - lifecycle
    preferredTaskTypes:
      - ops
      - health
      - monitoring
      - incident-triage
    greenlightRequiredFor:
      - restart-service
      - destructive
      - config-change
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    wrapper: operator:health
  - id: scribe
    name: Scribe
    role: Docs / Summaries
    specialty: docs, summaries, messages, notes
    model: qwen3.8-27b-dense
    mission: Produce clean, concise documents and summaries with no fabricated facts.
    profile: scribe
    modes:
      - write
    tools:
      - file
      - todo
    skills: []
    capabilities:
      - documentation
      - summarization
      - drafting
    preferredTaskTypes:
      - docs
      - summary
      - notes
      - writeup
    greenlightRequiredFor:
      - publish
      - external-send
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    wrapper: scribe:write
